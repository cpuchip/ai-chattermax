# ai-chattermax — Dokploy Compose deployment (its own project, sibling to ibeco.me).
# Domain (chat.ibeco.me) + TLS are attached by Dokploy's domain config (Traefik
# labels injected per-instance), so they are NOT hardcoded here. The app joins
# the external dokploy-network for routing and an internal network for Postgres.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chattermax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chattermax}
      POSTGRES_DB: chattermax
    volumes:
      # postgres:18 stores data in a major-version subdirectory, so the mount
      # must be at /var/lib/postgresql (NOT /data) or pg18 refuses to start.
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chattermax -d chattermax"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  chattermax:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://chattermax:${POSTGRES_PASSWORD:-chattermax}@postgres:5432/chattermax?sslmode=disable"
      # Production auth: borrow the ibeco.me session. Set AUTH_MODE=dev only for
      # a throwaway/local instance (name login, no real identity).
      AUTH_MODE: ${AUTH_MODE:-ibeco}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.ibeco.me}
      IBECO_BASE_URL: ${IBECO_BASE_URL:-https://ibeco.me}
      # DH-4: the dnd-tools sidecar (sheets for /attack, /check, /char…).
      # Internal service-name URL; the key gates writes (set it in the
      # deployment env — commands stay politely disabled if unset).
      DND_URL: ${DND_URL:-http://dnd:8089}
      DND_API_KEY: ${DND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # dnd-tools (DH-4): campaign + character sheets behind the D&D slash
  # commands, and the substrate personas' remote MCP (/mcp?key=). Built
  # straight from the public repo. State is one SQLite file on a volume.
  # The dnd.ibeco.me domain (for the remote bridge) is attached by Dokploy's
  # domain config, same as chattermax's.
  dnd:
    build:
      context: https://github.com/cpuchip/dnd-tools.git
    environment:
      DND_DB: /data/dnd.db
      DND_HTTP: ":8089"
      DND_API_KEY: ${DND_API_KEY:-}
    volumes:
      - dnddata:/data
    expose:
      - "8089"
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8089/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true
  internal: {}

volumes:
  pgdata:
  dnddata:
