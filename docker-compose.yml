# ai-chattermax — Dokploy Compose deployment (its own project, sibling to ibeco.me).
# Domain (chat.ibeco.me) + TLS are attached by Dokploy's domain config, which
# injects the Traefik labels for this instance — so they are NOT hardcoded here.
# The service joins the external dokploy-network so Traefik can route to it.
services:
  chattermax:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      # COOKIE_DOMAIN: ".ibeco.me"   # enabled when ibeco.me cookie auth lands (#2)
    expose:
      - "8080"
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  dokploy-network:
    external: true
